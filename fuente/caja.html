<title>Alumnos y Cuotas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: planilla FACK — fondo casi negro, paneles grafito, títulos Anton en mayúscula inclinada, etiquetas Barlow Condensed, magenta y celeste de marca */
:root{
  --bg:#0B0B12; --sheet:#15151F; --ink:#FFFFFF; --muted:#9A9AAD; --grid:#2A2A3A; --head:#11111A;
  --accent:#D61E8D; --accent-soft:#3A1430; --accent-ink:#FFFFFF;
  --paid:#4CA4D7; --paid-soft:#14293A; --pend:#F0B44C; --pend-soft:#33270F; --late:#FF3DA5; --late-soft:#3D1029;
  --today:#D61E8D; --line2:#3A3A4E;
  --f-ui:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  --f-display:"Anton",Impact,"Arial Narrow",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:.95;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left;letter-spacing:.005em}
h1 em{font-style:normal;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em}
.muted{color:var(--muted)}
.lbl{font-family:var(--f-cond);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--paid);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-family:var(--f-cond);font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;border:2px solid var(--line2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.paid{background:var(--paid);color:#0B0B12}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.month{display:flex;align-items:center;gap:4px;background:transparent;border:2px solid var(--line2);border-radius:999px;padding:2px 4px}
.month button{border:0;background:none;width:32px;height:30px;border-radius:999px;font-size:18px;color:var(--ink)}
.month button:hover{background:var(--head)}
.month span{min-width:140px;text-align:center;font-family:var(--f-cond);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* resumen strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.strip>div{padding:10px 14px;border-left:1px solid var(--grid);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div:first-child{border-left:0}
.strip .v{font-size:17px}
.progress{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;background:var(--paid)}
@media (max-width:640px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--grid)}}

.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;font-size:13.5px}
.alert.late{background:var(--late-soft)} .alert.today{background:var(--pend-soft)} .alert.info{background:var(--accent-soft)}
.alert b{font-weight:700}
.alert p{margin:0;flex:1;min-width:0}

/* calendario */
.cal{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:8px;font-family:var(--f-cond);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:var(--head);border-bottom:1px solid var(--grid)}
.day{min-height:104px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;background:none;border-top:0;border-left:0;text-align:left;align-items:stretch}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--head);opacity:.55}
.day .dn{font-family:var(--f-cond);font-size:15px;font-weight:700;color:var(--muted);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.is-today .dn{background:var(--today);color:var(--accent-ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;border-radius:4px;padding:2px 5px;border:0;text-align:left;width:100%;min-width:0}
.ev .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;min-width:0}
.ev .a{font-family:var(--f-num);font-size:10.5px;flex:none}
.ev.paid{background:var(--paid-soft);color:var(--paid)} .ev.paid .n{text-decoration:line-through;text-decoration-thickness:1px}
.ev.pend,.ev.tomorrow,.ev.today{background:var(--pend-soft);color:var(--pend)}
.ev.late{background:var(--late-soft);color:var(--late)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
.dots .paid{background:var(--paid)} .dots .pend,.dots .today,.dots .tomorrow{background:var(--pend)} .dots .late{background:var(--late)}
@media (max-width:640px){
  .day{min-height:58px;padding:4px;align-items:center}
  .day .evs{display:none}.dots{display:flex;justify-content:center}
}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cl{display:flex;gap:4px;font-size:11px;border-radius:4px;padding:1px 5px;border:1px solid var(--line2);color:var(--ink);background:transparent;min-width:0;width:100%;text-align:left}
.cl .h{font-family:var(--f-num);font-weight:700;color:var(--paid);flex:none}
.cl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dots i.c{background:transparent;border:1.5px solid var(--ink);width:7px;height:7px;box-sizing:border-box}
.seg{display:inline-flex;border:2px solid var(--line2);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);border-radius:999px;padding:6px 14px;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.clrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:end}
.clrow .x{height:42px;border:2px solid var(--line2);border-radius:8px;background:none;color:var(--muted);font-size:16px}
.sched{font-size:12.5px;color:var(--paid);font-family:var(--f-cond);font-weight:700;letter-spacing:.04em}
.tbtn{border:2px solid var(--line2);background:none;color:var(--ink);border-radius:999px;padding:5px 11px;font-family:var(--f-cond);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin:0 4px}
.tbtn.warn{border-color:color-mix(in srgb,var(--late) 60%,transparent);color:var(--late)}
.subh{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:6px;min-width:0}
.calnav .navb{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);background:none;color:var(--ink);font-size:18px;line-height:1}
.calnav .rango{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{background:var(--sheet);border:1px solid var(--grid);border-radius:10px}
.wk-head{display:grid;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--sheet);border-bottom:1px solid var(--grid);border-radius:10px 10px 0 0}
.wk-d{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;min-width:0}
.wk-d .wl{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.wk-d .wn{font-family:var(--f-display);font-size:22px;color:var(--ink);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.wk-d.hoy .wl{color:var(--accent)} .wk-d.hoy .wn{background:var(--accent);color:#fff}
.wk.dia .wk-head{display:none}
.wk-all{display:grid;border-bottom:1px solid var(--grid)}
.wk-lbl{font-family:var(--f-cond);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 4px;text-align:right;font-weight:700}
.wk-allc{display:flex;flex-direction:column;gap:2px;padding:3px 2px;border-left:1px solid var(--grid);min-width:0}
.wk-body{display:grid;position:relative}
.wk-hours{border-right:1px solid var(--grid)}
.wk-h{position:relative;font-family:var(--f-cond);font-size:12px;color:var(--muted);font-weight:600}
.wk-h span{position:absolute;top:-8px;right:8px;background:var(--sheet);padding:0 2px}
.wk-h:first-child span{top:2px}
.wk-col{position:relative;border-left:1px solid var(--grid);background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px);min-width:0}
.wk-hours+.wk-col{border-left:0}
.wk-col.hoy{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.slot{position:absolute;left:0;right:0;border:0;background:transparent;padding:0}
.slot:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.wk-ev{position:absolute;z-index:2;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 32%,var(--sheet));color:var(--ink);border-radius:6px;padding:3px 6px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;min-width:0}
.wk-ev .en{font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-ev .et{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.03em;color:color-mix(in srgb,var(--c) 45%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-ev.corto{flex-direction:row;gap:6px;align-items:center;padding:1px 6px}
.wk-ev.grp{border-width:2px;border-style:dashed}
.wk-ev:hover{background:color-mix(in srgb,var(--c) 45%,var(--sheet))}
.ahora{position:absolute;left:-1px;right:0;height:2px;background:var(--accent);z-index:3;pointer-events:none}
.ahora::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tira{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tdia{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px}
.tdia .tl{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.1em}
.tdia .tn{font-family:var(--f-display);font-size:20px;color:var(--ink);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.tdia.hoy .tl{color:var(--accent)}
.tdia.on .tn{background:var(--accent);color:#fff}
.tdia .td{display:flex;gap:3px;height:7px}
.tdia .td i{width:6px;height:6px;border-radius:50%}
.tdia .td i.c{border:1.5px solid var(--ink);box-sizing:border-box}
.tdia .td i.paid{background:var(--paid)} .tdia .td i.pend,.tdia .td i.today,.tdia .td i.tomorrow{background:var(--pend)} .tdia .td i.late{background:var(--late)}
@media (max-width:640px){
  .calnav .rango{font-size:16px}
  .calbar{gap:8px}
  .wk.semana .wk-ev{padding:2px 3px}
  .wk.semana .wk-ev .en{font-size:11px}
  .wk.semana .wk-ev .et{display:none}
  .wk.semana .wk-d .wn{font-size:17px;width:30px;height:30px}
  .wk.semana .wk-d .wl{font-size:10px;letter-spacing:.06em}
  .wk.semana .wk-allc .ev .a{display:none}
  .wk.semana .wk-allc .ev{padding:1px 3px;font-size:10px}
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}

/* lista del día */
.daylist{display:flex;flex-direction:column;gap:8px}

/* planilla */
.sheetbox{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.tablewrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.grid th,.grid td{border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:0;text-align:left;vertical-align:middle}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid th{background:var(--head);font-family:var(--f-cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;white-space:nowrap}
.grid td.rn,.grid th.rn{width:38px;text-align:center;color:var(--muted);font-family:var(--f-num);font-size:11px;background:var(--head)}
.grid td{height:38px}
.grid td .txt{padding:0 10px}
.grid input,.grid select{font:inherit;color:inherit;border:0;background:transparent;width:100%;height:38px;padding:0 10px;min-width:0}
.grid input:focus,.grid select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.grid input.money{font-family:var(--f-num);text-align:right}
.grid .first{position:sticky;left:0;background:var(--sheet);z-index:1}
.grid th.first{background:var(--head)}
.grid tr.add td{background:var(--accent-soft)}
.grid tr.add td.rn{color:var(--accent);font-weight:700}
.grid tr.add input::placeholder{color:var(--accent);opacity:.75}
.grid tr.off td{color:var(--muted)}
.grid tfoot td{background:var(--head);font-weight:700;padding:0 10px;height:36px}
.pill{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:4px 11px;font-family:var(--f-cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:0 8px;white-space:nowrap}
.pill.paid{background:var(--paid-soft);color:var(--paid)} .pill.late{background:var(--late-soft);color:var(--late)}
.pill.pend,.pill.today,.pill.tomorrow{background:var(--pend-soft);color:var(--pend)} .pill.na{background:var(--head);color:var(--muted)}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:6px;color:var(--muted);font-size:16px}
.icon-btn:hover{background:var(--head);color:var(--late)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.search{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--grid);border-radius:8px;padding:8px 11px;min-width:0;flex:1;max-width:320px}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* resumen */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-ui);font-size:11px}
.catrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.catrow .bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--grid);overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--late)}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--grid);padding-bottom:6px}
.kv:last-child{border-bottom:0;padding-bottom:0}

/* pestañas de hoja */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--head);border-top:1px solid var(--grid);z-index:10;
  padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;gap:2px}
nav.tabs button{border:0;border-right:1px solid var(--grid);background:none;padding:13px 18px 14px;font-family:var(--f-cond);font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap;position:relative}
nav.tabs button[aria-current="page"]{background:var(--sheet);color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(5,5,10,.7);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.panel{background:var(--sheet);border:1px solid var(--line2);width:100%;max-width:440px;border-radius:14px 14px 0 0;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s ease}
@media (min-width:700px){.panel{border-radius:14px}}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--grid);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;padding:9px 15px;border-radius:8px;font-weight:600;z-index:40;max-width:90%}
.foot{font-size:12px;color:var(--muted)}
nav.tabs svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{display:none}
.mlist{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--grid);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--grid);background:none;text-align:left;width:100%;color:var(--ink)}
.mrow:first-child{border-top:0}
.mrow .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--head);color:var(--ink);border:2px solid var(--line2)}
.mrow .t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.mrow .r .pill{margin:0}
.mrow.off{opacity:.55}
@media (max-width:640px){
  .wrap{padding-block:12px 150px;gap:12px}
  .top{gap:10px}
  .top>.brand{flex:1 1 auto}
  .top-actions{width:100%;justify-content:space-between}
  #addAlumno{display:none}
  .month{flex:1;justify-content:space-between}
  .month button{width:40px;height:36px}
  .userchip{padding-right:10px;max-width:46%}
  .strip .v{font-size:16px}
  .field input,.field select,.search,.grid input,.grid select{font-size:16px}
  nav.tabs{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}

<script>
(function(){
const CURSOS=["Canto","Guitarra","Piano","Batería","Bajo","Producción","Mezcla","Ensambles","Mentoría","Otro"];
const GRUPALES=["Ensambles"];
const grupoDe=a=>String((a&&a.grupo)||"").replace(/\|/g,"/").trim();
const nombresGrupo=()=>[...new Set(alumnos.filter(a=>GRUPALES.includes(a.curso)&&grupoDe(a)).map(grupoDe))].sort((x,y)=>x.localeCompare(y));
const tituloGrupo=(curso,g,n)=>`${g||curso} · ${n}`;
const MEDIOS=["Transferencia","Efectivo","Mercado Pago","Otro"];
const CATS=["Alquiler","Sueldos y profes","Servicios","Equipos","Publicidad","Impuestos","Insumos","Otros"];
const LS="alumnos-cuotas-v1";
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const fmtK=n=>n>=1e6?"$"+(n/1e6).toFixed(1).replace(".",",")+"M":n>=1e3?"$"+Math.round(n/1e3)+"k":"$"+Math.round(n);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d||1)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const mk=(y,m)=>y+"-"+pad(m+1);
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const toNum=v=>{const n=parseFloat(String(v).replace(/\./g,"").replace(",","."));return isFinite(n)?n:0};

let alumnos=[],pagos={},gastos=[],liquidaciones=[],config={};
let cols=null,loaded=false;
let tab="cal",selDay=null,buscar="",verInactivos=false,pendingRender=false;
let cur=(()=>{const t=today();return {y:t.getFullYear(),m:t.getMonth()}})();

/* ---------- guardar ---------- */
function lsSave(){if(cols)return;try{localStorage.setItem(LS,JSON.stringify({alumnos,pagos,gastos,liquidaciones,config}))}catch(e){}}
async function put(col,id,data){
  if(col==="alumnos"){const i=alumnos.findIndex(x=>x.id===id);const v={id,...data};i>=0?alumnos[i]=v:alumnos.push(v)}
  if(col==="pagos")pagos[id]={id,...data};
  if(col==="gastos"){const i=gastos.findIndex(x=>x.id===id);const v={id,...data};i>=0?gastos[i]=v:gastos.push(v)}
  if(col==="liquidaciones"){const i=liquidaciones.findIndex(x=>x.id===id);const v={id,...data};i>=0?liquidaciones[i]=v:liquidaciones.push(v)}
  if(col==="config")config[id]={...data};
  safeRender();
  if(cols){try{const {id:_,...rest}=data;await cols[col].doc(id).set(rest)}catch(e){toast("No se pudo guardar. Revisá la conexión.")}}else lsSave();
}
async function del(col,id){
  if(col==="alumnos")alumnos=alumnos.filter(x=>x.id!==id);
  if(col==="pagos")delete pagos[id];
  if(col==="gastos")gastos=gastos.filter(x=>x.id!==id);
  if(col==="liquidaciones")liquidaciones=liquidaciones.filter(x=>x.id!==id);
  if(col==="config")delete config[id];
  safeRender();
  if(cols){try{await cols[col].doc(id).delete()}catch(e){toast("No se pudo borrar.")}}else lsSave();
}
const strip=o=>{const {id,...r}=o;return r};

/* ---------- roles: la versión instalada reemplaza estas funciones ---------- */
function esDueno(){return true}
function puede(k){return true}
function nombreAdmin(){return "el administrador"}
function aAdmin(){const n=nombreAdmin();return n==="el administrador"?"al administrador":"a "+n}
function parteGeneral(){return Object.assign({tipo:"pct",valor:0},config.parte||{})}
function parteMon(a){
  if(!esDueno())return a.aCobrarMoneda||monDe(a);
  const propia=a.parteAdmin&&(a.parteAdmin.tipo==="pct"||a.parteAdmin.tipo==="monto");
  return !propia&&parteGeneral().tipo==="monto"?"ARS":monDe(a);
}
function parteDe(a){return enPesos(parteOrig(a),parteMon(a))}
function parteOrig(a){
  if(!esDueno())return Number(a.aCobrar)||0;
  const p=a.parteAdmin&&(a.parteAdmin.tipo==="pct"||a.parteAdmin.tipo==="monto")?a.parteAdmin:parteGeneral(),v=Number(p.valor)||0;
  return p.tipo==="monto"?Math.max(0,Math.round(v)):Math.max(0,Math.round((Number(a.cuota)||0)*v/100));
}
const MONEDAS={ARS:{s:"$",n:"Pesos"},USD:{s:"US$",n:"Dólares"},EUR:{s:"€",n:"Euros"}};
const monDe=a=>MONEDAS[a&&a.moneda]?a.moneda:"ARS";
const cotiz=mon=>mon==="ARS"||!MONEDAS[mon]?1:(Number(config.cambio&&config.cambio[mon])||0);
const enPesos=(n,mon)=>(Number(n)||0)*cotiz(mon||"ARS");
const fmtM=(n,mon)=>!mon||mon==="ARS"?fmt(n):MONEDAS[mon].s+" "+new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(Number(n)||0);
const fmtKM=(n,mon)=>!mon||mon==="ARS"?fmtK(n):MONEDAS[mon].s+new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(Number(n)||0);
const usaOtraMoneda=()=>alumnos.some(a=>monDe(a)!=="ARS");
const faltaCotiz=()=>Object.keys(MONEDAS).filter(k=>k!=="ARS"&&alumnos.some(a=>monDe(a)===k&&activoEn(a,cur.y,cur.m))&&!cotiz(k));
const parteTxt=p=>p&&p.tipo==="monto"?fmt(p.valor):`${Number(p&&p.valor)||0}%`;
const tieneCuota=a=>Number(a.cuota)>0||a.cobra===true;
const esDelAdmin=g=>g&&(g.por==="admin"||g.por==="licha");
function liqMes(y,m){const k=mk(y,m);return liquidaciones.filter(l=>l.mes===k)}
function correspondeAdmin(y,m){return alumnos.filter(a=>activoEn(a,y,m)).reduce((s,a)=>s+parteDe(a),0)}

/* ---------- lógica de cuotas ---------- */
const activoEn=(a,y,m)=>{const k=mk(y,m);if(a.inicio&&a.inicio>k)return false;if(a.fin)return k<a.fin;return a.activo!==false};
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],DIAS_L=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const clasesDe=a=>Array.isArray(a.clases)?a.clases.filter(c=>c&&c.d>=1&&c.d<=7).map(c=>{const h=c.h||"18:00";let hf=c.hf;if(!hf){const t=(+h.split(":")[0])*60+(+h.split(":")[1]||0)+(c.dur||60);hf=String(Math.min(23*60+59,t)/60|0).padStart(2,"0")+":"+String(Math.min(23*60+59,t)%60).padStart(2,"0")}return {id:c.id||"",d:c.d,h,hf}}):[];
const horarioTxt=a=>{const c=clasesDe(a).slice().sort((x,y)=>x.d-y.d||String(x.h).localeCompare(String(y.h)));return c.length?c.map(x=>`${DIAS[x.d-1]} ${x.h}–${x.hf}`.trim()).join(" · "):""};//||""}`.trim()).join(" · "):""};
const finTxt=a=>a.fin?new Date(+a.fin.slice(0,4),+a.fin.slice(5,7)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}):"";
let calVer="todo";
const diaVence=(a,y,m)=>Math.min(Math.max(1,a.diaPago||10),lastDay(y,m));
const pagoDe=(a,y,m)=>pagos[a.id+"_"+mk(y,m)];
function estado(a,y,m){
  if(!activoEn(a,y,m))return "na";
  if(pagoDe(a,y,m))return "paid";
  if(!tieneCuota(a))return "na";
  const diff=Math.round((new Date(y,m,diaVence(a,y,m))-today())/864e5);
  return diff<0?"late":diff===0?"today":diff===1?"tomorrow":"pend";
}
const estTxt={paid:"Pagó",late:"Atrasado",today:"Vence hoy",tomorrow:"Vence mañana",pend:"Pendiente",na:"—"};
function resumenMes(y,m){
  const act=alumnos.filter(a=>activoEn(a,y,m));
  let esperado=0,cobrado=0,late=0,pend=0;
  for(const a of act){esperado+=enPesos(a.cuota,monDe(a));const p=pagoDe(a,y,m);if(p)cobrado+=enPesos(p.monto,p.moneda||monDe(a));else{const e=estado(a,y,m);e==="late"?late++:pend++}}
  const gas=gastos.filter(g=>g.fecha&&g.fecha.startsWith(mk(y,m))).reduce((s,g)=>s+(g.monto||0),0)+(esDueno()?liqMes(y,m).reduce((s,l)=>s+(Number(l.monto)||0),0):0);
  return {act:act.length,esperado,cobrado,late,pend,gas,porCobrar:Math.max(0,esperado-act.filter(a=>pagoDe(a,y,m)).reduce((s,a)=>s+enPesos(a.cuota,monDe(a)),0))};
}

/* ---------- vistas ---------- */
function stripHTML(){
  if(!puede("verMontos"))return stripAdminHTML();
  const r=resumenMes(cur.y,cur.m),pc=r.esperado?Math.min(100,r.cobrado/r.esperado*100):0;
  return `<div class="strip">
    <div><span class="lbl">Cobrado</span><span class="num v" style="color:var(--paid)">${fmt(r.cobrado)}</span><div class="progress"><i style="width:${pc.toFixed(0)}%"></i></div></div>
    <div><span class="lbl">Falta cobrar</span><span class="num v">${fmt(r.porCobrar)}</span><span class="muted" style="font-size:12px">de ${fmt(r.esperado)}</span></div>
    <div><span class="lbl">Alumnos activos</span><span class="num v">${r.act}</span><span class="muted" style="font-size:12px">${r.pend} pendientes</span></div>
    <div><span class="lbl">Atrasados</span><span class="num v" style="color:${r.late?"var(--late)":"inherit"}">${r.late}</span><span class="muted" style="font-size:12px">gastos ${fmt(r.gas)}</span></div>
  </div>`;
}
function stripAdminHTML(){
  const {y,m}=cur,corr=correspondeAdmin(y,m),rec=liqMes(y,m).reduce((s,l)=>s+(Number(l.monto)||0),0),act=alumnos.filter(a=>activoEn(a,y,m)).length;
  return `<div class="strip">
    <div><span class="lbl">Te corresponde</span><span class="num v" style="color:var(--paid)">${fmt(corr)}</span><span class="muted" style="font-size:12px">este mes</span></div>
    <div><span class="lbl">Recibido</span><span class="num v">${fmt(rec)}</span><div class="progress"><i style="width:${corr?Math.min(100,rec/corr*100).toFixed(0):0}%"></i></div></div>
    <div><span class="lbl">Falta recibir</span><span class="num v">${fmt(Math.max(0,corr-rec))}</span></div>
    <div><span class="lbl">Alumnos activos</span><span class="num v">${act}</span></div>
  </div>`;
}
function alertsHTML(){
  const t=today(),y=t.getFullYear(),m=t.getMonth(),out=[];
  const hoy=alumnos.filter(a=>estado(a,y,m)==="today"),man=alumnos.filter(a=>estado(a,y,m)==="tomorrow");
  const late=alumnos.filter(a=>estado(a,y,m)==="late");
  const names=arr=>arr.map(a=>puede("verMontos")?`${esc(a.nombre)} (${fmtM(a.cuota,monDe(a))})`:esc(a.nombre)).join(", ");
  if(!puede("verCobros")){hoy.length=0;man.length=0;late.length=0}
  if(late.length)out.push(`<div class="alert late"><p><b>Atrasados:</b> ${names(late)}</p></div>`);
  if(hoy.length)out.push(`<div class="alert today"><p><b>Cobran hoy:</b> ${names(hoy)}</p></div>`);
  if(man.length)out.push(`<div class="alert today"><p><b>Cobran mañana:</b> ${names(man)}</p></div>`);
  if(cols)out.push(`<div class="alert info"><p><b>Versión de demostración.</b> Los datos reales del negocio, con las cuentas de dueño y administrador, van en la app instalada.</p></div>`);
  if(alumnos.some(a=>a.ejemplo))out.push(`<div class="alert info"><p>Estos alumnos son <b>de ejemplo</b>. Cargá los tuyos y borrá estos cuando quieras.</p><button class="btn sm ghost" id="clearEx">Borrar ejemplos</button></div>`);
  return out.length?`<div class="alerts">${out.join("")}</div>`:"";
}
function evHTML(a,y,m,full){
  const e=estado(a,y,m);
  const vm=puede("verMontos");
  return `<span class="ev ${e}" role="button" tabindex="0" data-cuota="${a.id}" data-ym="${mk(y,m)}" title="${esc(a.nombre)}${vm?" · "+fmtM(a.cuota,monDe(a)):""} · ${estTxt[e]}"><span class="n">${esc(a.nombre)}</span>${full&&vm?`<span class="a">${fmtKM(a.cuota||0,monDe(a))}</span>`:""}</span>`;
}
function vCalMes(){
  const {y,m}=cur,first=new Date(y,m,1),start=(first.getDay()+6)%7,days=lastDay(y,m);
  const t=today(),isCur=t.getFullYear()===y&&t.getMonth()===m;
  const SD=selDay??(isPhone()&&isCur?t.getDate():null);
  const act=alumnos.filter(a=>activoEn(a,y,m));
  const byDay={};for(const a of act){if(!puede("verCobros")||!tieneCuota(a))continue;const d=diaVence(a,y,m);(byDay[d]=byDay[d]||[]).push(a)}
  const clasesDia=d=>{const wd=(new Date(y,m,d).getDay()+6)%7+1,out=[],gr={};for(const a of act)for(const c of clasesDe(a))if(c.d===wd){
      if(GRUPALES.includes(a.curso)){const g=grupoDe(a),k=`${a.curso}|${wd}|${c.h}|${c.hf}|${g}`;if(!gr[k]){gr[k]={curso:a.curso,wd,h:c.h,hf:c.hf,g,miembros:[]};out.push({grupo:gr[k],h:c.h,hf:c.hf,nombre:""})}gr[k].miembros.push(a)}
      else out.push({a,h:c.h,hf:c.hf,nombre:a.nombre})}
    for(const o of out)if(o.grupo){o.grupo.miembros.sort((p,q)=>p.nombre.localeCompare(q.nombre));o.nombre=tituloGrupo(o.grupo.curso,o.grupo.g,o.grupo.miembros.length)}
    return out.sort((p,q)=>p.h.localeCompare(q.h)||p.nombre.localeCompare(q.nombre))};
  const grAttr=c=>`data-grupo="${esc(c.grupo.curso)}|${c.grupo.wd}|${c.grupo.h}|${c.grupo.hf}|${esc(c.grupo.g||"")}"`;
  const verCl=calVer!=="cuotas",verCu=calVer!=="clases";
  let cells="";const total=Math.ceil((start+days)/7)*7;
  for(let i=0;i<total;i++){
    const d=i-start+1;
    if(d<1||d>days){cells+=`<div class="day out" aria-hidden="true"></div>`;continue}
    const cu=verCu?(byDay[d]||[]).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)):[];
    const cl=verCl?clasesDia(d):[];
    const items=[...cl.map(c=>`<span class="cl" title="${esc(c.grupo?c.nombre+": "+c.grupo.miembros.map(x=>x.nombre).join(", "):c.nombre)} · clase ${esc(c.h)}"><span class="h">${esc(c.h)}</span><span class="n">${esc(c.nombre)}</span></span>`),...cu.map(a=>evHTML(a,y,m,true))];
    const max=4,shown=items.slice(0,max);
    cells+=`<div class="day ${isCur&&t.getDate()===d?"is-today":""} ${SD===d?"sel":""}" data-day="${d}" role="button" tabindex="0" aria-label="${d}: ${cl.length} clases, ${cu.length} cuotas">
      <span class="dn">${d}</span>
      <span class="evs">${shown.join("")}${items.length>max?`<span class="more">+${items.length-max} más</span>`:""}</span>
      <span class="dots">${cl.map(()=>`<i class="c"></i>`).join("")}${cu.map(a=>`<i class="${estado(a,y,m)}"></i>`).join("")}</span></div>`;
  }
  let det="";
  if(SD&&SD<=days){
    const cu=byDay[SD]||[],cl=clasesDia(SD);
    const fecha=new Date(y,m,SD).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
    det=`<div class="sheetbox"><div class="subh" style="color:var(--ink);font-size:15px">${fecha}</div>
      ${verCl?`<div class="subh">Clases</div><div class="tablewrap"><table class="grid" style="min-width:0"><tbody>
      ${cl.map(c=>`<tr><td style="width:110px"><div class="txt num" style="color:var(--paid)">${esc(c.h)}–${esc(c.hf)}</div></td><td><button class="txt" ${c.grupo?grAttr(c):`data-edit-al="${c.a.id}"`} style="border:0;background:none;color:inherit;text-align:left;padding:0 10px;font-weight:600">${esc(c.nombre)}</button></td><td><div class="txt muted">${esc(c.grupo?c.grupo.miembros.map(x=>x.nombre).join(", "):(c.a.curso||""))}</div></td></tr>`).join("")||`<tr><td><div class="empty" style="padding:12px">No hay clases este día.</div></td></tr>`}
      </tbody></table></div>`:""}
      ${verCu?`<div class="subh">Cuotas</div><div class="tablewrap"><table class="grid" style="min-width:0"><tbody>

      <div class="actions"><button class="btn" id="gX">Listo</button></div>`);
    $("#gX").onclick=closePanel;return;
  }
  if(!esDueno()&&!g&&!puede("cargarGastos")){toast("No tenés permiso para cargar gastos.");return}
  const def=t.getFullYear()===cur.y&&t.getMonth()===cur.m?iso(t):mk(cur.y,cur.m)+"-01";
  g=g||{fecha:def,concepto:"",categoria:"Alquiler",monto:""};
  panel(`<h2 style="font-size:24px">${nuevo?"Nuevo gasto":"Editar gasto"}</h2>
    <div class="field"><label for="gC">Concepto</label><input id="gC" value="${esc(g.concepto)}" placeholder="Ej: Alquiler de la sala"></div>
    <div class="two"><div class="field"><label for="gM">Monto</label><input id="gM" inputmode="numeric" value="${g.monto||""}"></div>
      <div class="field"><label for="gF">Fecha</label><input id="gF" type="date" value="${g.fecha}"></div></div>
    <div class="field"><label for="gK">Categoría</label><select id="gK">${CATS.map(c=>`<option ${c===g.categoria?"selected":""}>${c}</option>`).join("")}</select></div>
    ${esDueno()?`<label class="check" style="color:var(--ink)"><input type="checkbox" id="gV" ${g.visibleAdmin?"checked":""} style="width:18px;height:18px"> Que lo ve${esc(aAdmin())}</label>`:""}
    <div class="actions"><button class="btn ghost" id="gX">Cancelar</button><button class="btn" id="gOk">${nuevo?"Agregar":"Guardar"}</button></div>
    ${nuevo?"":`<div class="actions"><button class="btn ghost" id="gDel" style="color:var(--late);border-color:var(--late)">Eliminar gasto</button></div>`}`);
  $("#gX").onclick=closePanel;
  $("#gOk").onclick=()=>{const c=$("#gC").value.trim(),mo=toNum($("#gM").value);if(!c||!mo){toast("Completá concepto y monto.");return}
    const data={fecha:$("#gF").value||def,concepto:c,categoria:$("#gK").value,monto:mo,por:nuevo?yo.id:(g.por||null),ejemplo:false};
    if(esDueno())data.visibleAdmin=!!($("#gV")&&$("#gV").checked);
    put("gastos",nuevo?uid():g.id,nuevo?data:{...strip(g),...data,ejemplo:!!g.ejemplo});closePanel();toast(nuevo?"Gasto cargado":"Cambios guardados")};
  if(!nuevo)$("#gDel").onclick=()=>{del("gastos",g.id);closePanel();toast("Gasto borrado")};
}
function nuevoAlumnoPanel(){alumnoPanel(null)}
function nuevoAlumnoPanelViejo(){
  panel(`<h2 style="font-size:19px">Nuevo alumno</h2>
    <div class="field"><label for="aN">Nombre y apellido</label><input id="aN" autocomplete="off"></div>
    <div class="two"><div class="field"><label for="aC">Curso</label><select id="aC">${CURSOS.map(c=>`<option>${c}</option>`).join("")}</select></div>

function crearAlumno(nombre,curso,cuota,dia,tel,clases){
  nombre=(nombre||"").trim();if(!nombre){toast("Escribí el nombre del alumno.");return false}
  const extra=typeof cuota==="object"&&cuota?cuota:(esDueno()?{cuota:toNum(cuota),diaPago:Math.min(31,Math.max(1,parseInt(dia)||10))}:{});
  put("alumnos",uid(),{nombre,curso,...extra,telefono:(tel||"").trim(),clases:clases||[],inicio:(()=>{const t=today(),k=mk(t.getFullYear(),t.getMonth()),c=mk(cur.y,cur.m);return c<k?c:k})(),activo:true,por:yo.id,ejemplo:false});
  toast(`${nombre} agregado`);return true;
}

/* ---------- calendario del teléfono ---------- */
let downloads=null;
async function bajarICS(){
  const act=alumnos.filter(a=>a.activo!==false&&!a.ejemplo);
  if(!act.length){toast("Cargá tus alumnos primero.");return}
  if(!downloads){toast("Este visor no deja bajar archivos. Abrilo desde claude.ai.");return}
  const t=today(),st=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const e=s=>String(s).replace(/[\\,;]/g,x=>"\\"+x);
  const ev=act.map(a=>{const d=Math.min(a.diaPago||10,28);let start=new Date(t.getFullYear(),t.getMonth(),d);if(start<t)start=new Date(t.getFullYear(),t.getMonth()+1,d);
    const ds=iso(start).replace(/-/g,""),de=iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+1)).replace(/-/g,"");
    const tit=`Cuota ${a.nombre} ${fmtM(a.cuota,monDe(a))}`;
    return ["BEGIN:VEVENT","UID:"+a.id+"@alumnos-cuotas","DTSTAMP:"+st,"DTSTART;VALUE=DATE:"+ds,"DTEND;VALUE=DATE:"+de,"RRULE:FREQ=MONTHLY;BYMONTHDAY="+((a.diaPago||10)>28?-1:d),"SUMMARY:"+e(tit),"DESCRIPTION:"+e((a.curso||"")+(a.telefono?" · "+a.telefono:"")),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+e("Mañana: "+tit),"TRIGGER:-PT15H","END:VALARM","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+e("Hoy: "+tit),"TRIGGER:PT9H","END:VALARM","END:VEVENT"].join("\r\n")});
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Alumnos y Cuotas//ES",...ev,"END:VCALENDAR"].join("\r\n");
  try{await downloads.save({filename:"cuotas-alumnos.ics",data:new Blob([ics],{type:"text/calendar"})});toast("Abrí el archivo para sumarlo al calendario")}catch(er){if(er&&er.code!=="declined")toast("No se pudo bajar el archivo.")}
}

/* ---------- usuarios ---------- */
let userCap=null,yo={id:null,name:"",rol:""},nombres={},pidiendo=false;
const COL_DUENO="#D61E8D",COL_ADMIN="#4CA4D7";
function quien(id){if(!id)return "—";if(id===yo.id)return "Vos";return nombres[id]||"Otro usuario"}
const inicial=n=>(n||"?").trim().charAt(0).toUpperCase();
async function resolverNombres(){
  if(!userCap||pidiendo)return;
  const ids=new Set();Object.values(pagos).forEach(p=>p.por&&ids.add(p.por));gastos.forEach(g=>g.por&&ids.add(g.por));alumnos.forEach(a=>a.por&&ids.add(a.por));
  const faltan=[...ids].filter(i=>i!==yo.id&&!nombres[i]);if(!faltan.length)return;
  pidiendo=true;try{const ps=await userCap.profiles(faltan);let cambio=false;for(const i of faltan){const n=ps[i]&&ps[i].name;if(n){nombres[i]=n;cambio=true}}if(cambio)safeRender()}catch(e){}pidiendo=false;
}
function pintarUsuario(){
  const b=$("#userChip");if(!b)return;
  if(!yo.rol){b.hidden=true;return}
  b.hidden=false;
  const col=yo.rol==="Dueño"?COL_DUENO:COL_ADMIN;
  b.innerHTML=`<span class="av" style="background:${col}">${esc(inicial(yo.name))}</span><span class="who"><b>${esc(yo.name||"Vos")}</b><small>${esc(yo.rol)}</small></span>`;
  b.setAttribute("aria-label",`Usuario: ${yo.name||"vos"}, ${yo.rol}`);
}
function panelUsuarios(){
  const fila=(nombre,rol,col,detalle)=>`<div class="urow"><span class="av" style="background:${col}">${esc(inicial(nombre))}</span><div style="flex:1;min-width:0"><b>${esc(nombre)}</b><div class="by" style="color:${col}">${rol}</div><div class="muted" style="font-size:13px">${detalle}</div></div></div>`;

    <div class="card" style="background:var(--head)"><div class="lbl" style="color:var(--paid)">Estás usando</div><div><b>${esc(yo.name||"Vos")}</b> · ${esc(yo.rol||"—")}</div></div>
    <p class="muted" style="margin:0;font-size:13.5px">Para que Felipe entre: tocá <b>Compartir</b> arriba de esta página, invitalo con su mail y dale permiso para <b>editar</b>. Necesita una cuenta de Claude con ese mail. Si no puede editar, ve la app vacía.</p>
    <div class="actions"><button class="btn" id="uOk">Listo</button></div>`);

}

let tt;function toast(m){clearTimeout(tt);let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;tt=setTimeout(()=>t.remove(),2500)}

/* ---------- eventos ---------- */
document.addEventListener("click",ev=>{
  const T=ev.target;
  const tb=T.closest("nav.tabs [data-tab]");if(tb){tab=tb.dataset.tab;render();scrollTo(0,0);return}
  const go=T.closest("[data-go]");if(go){tab=go.dataset.go;render();return}
  const cu=T.closest("[data-cuota]");if(cu){ev.stopPropagation();abrirCuota(cu.dataset.cuota,cu.dataset.ym);return}
  const gr=T.closest("[data-grupo]");if(gr){const [c,wd,h,hf,...gg]=gr.dataset.grupo.split("|");verGrupo(c,+wd,h,hf,gg.join("|"));return}
  const ge=T.closest("[data-gev]");if(ge){verEventoExterno(ge.dataset.gev);return}
  const lq=T.closest("[data-liq]");if(lq){const l=liquidaciones.find(x=>x.id===lq.dataset.liq);if(l&&esDueno())liquidacionPanel(l);return}
  if(T.id==="admPagar"){liquidacionPanel(null);return}
  if(T.id==="admPerm"){panelPermisos();return}
  const sl=T.closest("[data-slot]");if(sl){if(!(esDueno()||puede("editarAlumnos")))return;const [f,h]=sl.dataset.slot.split("|"),D=parse(f);alumnoPanel(null,{clases:[{d:(D.getDay()+6)%7+1,h,hf:deMin(Math.min(23*60+45,aMin(h)+60))}]});return}
  const dy=T.closest("[data-day]");if(dy){const d=+dy.dataset.day;selDay=selDay===d?null:d;render();return}
  const cvw=T.closest("[data-calview]");if(cvw){calView=cvw.dataset.calview;if(calView!=="mes"&&!calAnchor){const t=today();calAnchor=(t.getFullYear()===cur.y&&t.getMonth()===cur.m)?t:new Date(cur.y,cur.m,1)}render();return}
  const cn=T.closest("[data-calnav]");if(cn){moverCal(cn.dataset.calnav);return}
  const gd=T.closest("[data-goday]");if(gd){const D=parse(gd.dataset.goday);calAnchor=D;cur={y:D.getFullYear(),m:D.getMonth()};calView="dia";render();return}
  const eal=T.closest("[data-edit-al]");if(eal){ev.stopPropagation();const a=alumnos.find(x=>x.id===eal.dataset.editAl);if(a)alumnoPanel(a);return}
  const bj=T.closest("[data-baja]");if(bj){const a=alumnos.find(x=>x.id===bj.dataset.baja);if(a){a.activo===false?reactivar(a):bajaPanel(a)}return}
  const da=T.closest("[data-del-al]");if(da){const a=alumnos.find(x=>x.id===da.dataset.delAl);if(a)eliminarPanel(a);return}
  const dg=T.closest("[data-del-g]");if(dg){del("gastos",dg.dataset.delG);toast("Gasto borrado");return}
  if(T.id==="newAdd"){const nm=$("#newNombre").value.trim();if(!nm){toast("Escribí el nombre del alumno.");return}
    alumnoPanel(null,{nombre:nm,curso:$("#newCurso").value,cuota:toNum($("#newCuota").value)||"",diaPago:parseInt($("#newDia").value)||10,telefono:$("#newTel").value.trim()});return}
  if(T.id==="ngAdd"){const c=$("#ngC").value.trim(),mo=toNum($("#ngM").value);if(!c||!mo){toast("Completá concepto y monto.");return}
    put("gastos",uid(),{fecha:$("#ngF").value||iso(today()),concepto:c,categoria:$("#ngK").value,monto:mo,visibleAdmin:!!($("#ngV")&&$("#ngV").checked),por:yo.id,ejemplo:false});toast("Gasto cargado");setTimeout(()=>{const n=$("#ngC");if(n)n.focus()},0);return}
  if(T.id==="cotizBtn"){panelCotiz();return}
  if(T.id==="icsBtn"){bajarICS();return}
  if(T.id==="clearEx"){alumnos.filter(a=>a.ejemplo).forEach(a=>del("alumnos",a.id));Object.values(pagos).filter(p=>p.ejemplo).forEach(p=>del("pagos",p.id));gastos.filter(g=>g.ejemplo).forEach(g=>del("gastos",g.id));toast("Ejemplos borrados");return}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape")closePanel();
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("[role=button]")){ev.preventDefault();ev.target.click()}
  if(ev.key==="Enter"&&ev.target.closest("tr.add")){ev.preventDefault();const b=ev.target.closest("tr").querySelector("#newAdd,#ngAdd");b&&b.click()}
  else if(ev.key==="Enter"&&ev.target.matches("table.grid input")){ev.target.blur()}
});
document.addEventListener("change",ev=>{
  const T=ev.target;
  if(T.id==="verInac"){verInactivos=T.checked;render();return}
  const tr=T.closest("tr[data-id]");
  if(tr&&T.dataset.f){const a=alumnos.find(x=>x.id===tr.dataset.id);if(!a)return;let v=T.value;
    if(T.dataset.f==="cuota")v=toNum(v);if(T.dataset.f==="diaPago")v=Math.min(31,Math.max(1,parseInt(v)||1));if(T.dataset.f==="nombre"&&!v.trim()){T.value=a.nombre;return}
    put("alumnos",a.id,{...strip(a),[T.dataset.f]:v});return}
  const gr=T.closest("tr[data-gid]");
  if(gr&&T.dataset.g){const g=gastos.find(x=>x.id===gr.dataset.gid);if(!g)return;let v=T.type==="checkbox"?T.checked:T.value;if(T.dataset.g==="monto")v=toNum(v);put("gastos",g.id,{...strip(g),[T.dataset.g]:v})}
});
document.addEventListener("input",ev=>{if(ev.target.id==="buscar"){buscar=ev.target.value;const pos=ev.target.selectionStart;render();const s=$("#buscar");if(s){s.focus();s.setSelectionRange(pos,pos)}}});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender)safeRender()},50)});
$("#addAlumno").onclick=nuevoAlumnoPanel;
$("#fab").onclick=()=>tab==="gastos"?gastoPanel(null):alumnoPanel(null);
document.addEventListener("click",ev=>{
  const eg=ev.target.closest("[data-edit-g]");if(eg){const g=gastos.find(x=>x.id===eg.dataset.editG);if(g)gastoPanel(g)}
});
try{let was=isPhone();addEventListener("resize",()=>{const n=isPhone();if(n!==was){was=n;safeRender()}})}catch(e){}
$("#userChip").onclick=panelUsuarios;
$("#prevM").onclick=()=>{const d=new Date(cur.y,cur.m-1,1);cur={y:d.getFullYear(),m:d.getMonth()};selDay=null;calAnchor=null;render()};
$("#nextM").onclick=()=>{const d=new Date(cur.y,cur.m+1,1);cur={y:d.getFullYear(),m:d.getMonth()};selDay=null;calAnchor=null;render()};

/* ---------- arranque ---------- */
function local(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r){alumnos=r.alumnos||[];pagos=r.pagos||{};gastos=r.gastos||[];liquidaciones=r.liquidaciones||[];config=r.config||{}}}catch(e){}loaded=true;render()}
render();
let fb=setTimeout(()=>{if(!loaded)local()},4000);
(async()=>{
  const c=window.claude;if(!c||!c.use)return;
  c.use("downloads").then(d=>{downloads=d}).catch(()=>{});
  c.use("user").then(async u=>{if(!u)return;userCap=u;try{const m=await u.me();yo={id:m.id,name:m.name,rol:"Demostración"}}catch(e){}pintarUsuario();resolverNombres();safeRender()}).catch(()=>{});
  let db=null;try{db=await c.use("db")}catch(e){}
  if(!db){clearTimeout(fb);if(!loaded)local();return}
  clearTimeout(fb);
  cols={alumnos:db.collection("alumnos"),pagos:db.collection("pagos"),gastos:db.collection("gastos"),liquidaciones:db.collection("liquidaciones"),config:db.collection("config")};
  const got={alumnos:false,pagos:false,gastos:false};
  cols.liquidaciones.onSnapshot(s=>{liquidaciones=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},()=>{});
  cols.config.onSnapshot(s=>{config={};s.docs.forEach(d=>config[d.id]={...d.data()});safeRender()},()=>{});
  const done=k=>{got[k]=true;if(got.alumnos&&got.pagos&&got.gastos)loaded=true;resolverNombres();safeRender()};
  const fail=()=>toast("Sin conexión con tu cuenta. Revisá internet y recargá.");
  cols.alumnos.onSnapshot(s=>{alumnos=s.docs.map(d=>({id:d.id,...d.data()}));done("alumnos")},fail);
  cols.pagos.onSnapshot(s=>{pagos={};s.docs.forEach(d=>pagos[d.id]={id:d.id,...d.data()});done("pagos")},fail);
  cols.gastos.onSnapshot(s=>{gastos=s.docs.map(d=>({id:d.id,...d.data()}));done("gastos")},fail);
})();
})();
</script>
