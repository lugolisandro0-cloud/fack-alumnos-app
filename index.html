<script>/* Actualizaciones: si hay una versión descargada más nueva que la instalada, se usa esa. */
(function(){
  var V="1.6.6";window.APP_VERSION=V;window.APP_BASE=window.APP_BASE||V;
  function cmp(a,b){a=String(a).split(".").map(Number);b=String(b).split(".").map(Number);for(var i=0;i<3;i++){var d=(a[i]||0)-(b[i]||0);if(d)return d>0?1:-1}return 0}
  window.cmpVersion=cmp;
  if(window.__fackSwap)return;
  try{
    if(localStorage.getItem("fack-update-off")==="1")return;
    var u=JSON.parse(localStorage.getItem("fack-update")||"null");
    if(!u||!u.html||cmp(u.v,V)<=0)return;
    if(u.base&&cmp(window.APP_BASE,u.base)<0)return;
    // Si la versión descargada no llegó a arrancar la vez anterior, se descarta.
    var p=localStorage.getItem("fack-update-arranque");
    if(p===u.v){localStorage.removeItem("fack-update");localStorage.removeItem("fack-update-arranque");localStorage.setItem("fack-update-mala",u.v);return}
    localStorage.setItem("fack-update-arranque",u.v);
    window.__fackSwap=1;
    document.write('<plaintext style="display:none">');
    var cambiar=function(){document.open();document.write(u.html);document.close()};
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(cambiar,0)});else setTimeout(cambiar,0);
  }catch(e){}
})();
</script>

<style>
@font-face{font-family:"Anton";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/anton-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/barlow-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/barlow-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/barlow-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/barlow-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2")}
html,body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{overscroll-behavior-y:none}
/* Layout: planilla FACK — fondo casi negro, paneles grafito, títulos Anton en mayúscula inclinada, etiquetas Barlow Condensed, magenta y celeste de marca */
:root{
  --bg:#0B0B12; --sheet:#15151F; --ink:#FFFFFF; --muted:#9A9AAD; --grid:#2A2A3A; --head:#11111A;
  --accent:#D61E8D; --accent-soft:#3A1430; --accent-ink:#FFFFFF;
  --paid:#4CA4D7; --paid-soft:#14293A; --pend:#F0B44C; --pend-soft:#33270F; --late:#FF3DA5; --late-soft:#3D1029;
  --today:#D61E8D; --line2:#3A3A4E;
  --f-ui:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  --f-display:"Anton",Impact,"Arial Narrow",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:.95;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left;letter-spacing:.005em}
h1 em{font-style:normal;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em}
.muted{color:var(--muted)}
.lbl{font-family:var(--f-cond);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--paid);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-family:var(--f-cond);font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;border:2px solid var(--line2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.paid{background:var(--paid);color:#0B0B12}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.month{display:flex;align-items:center;gap:4px;background:transparent;border:2px solid var(--line2);border-radius:999px;padding:2px 4px}
.month button{border:0;background:none;width:32px;height:30px;border-radius:999px;font-size:18px;color:var(--ink)}
.month button:hover{background:var(--head)}
.month span{min-width:140px;text-align:center;font-family:var(--f-cond);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* resumen strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.strip>div{padding:10px 14px;border-left:1px solid var(--grid);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div:first-child{border-left:0}
.strip .v{font-size:17px}
.progress{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;background:var(--paid)}
@media (max-width:640px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--grid)}}

.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;font-size:13.5px}
.alert.late{background:var(--late-soft)} .alert.today{background:var(--pend-soft)} .alert.info{background:var(--accent-soft)}
.alert b{font-weight:700}
.alert p{margin:0;flex:1;min-width:0}

/* calendario */
.cal{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:8px;font-family:var(--f-cond);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:var(--head);border-bottom:1px solid var(--grid)}
.day{min-height:104px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;background:none;border-top:0;border-left:0;text-align:left;align-items:stretch}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--head);opacity:.55}
.day .dn{font-family:var(--f-cond);font-size:15px;font-weight:700;color:var(--muted);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.is-today .dn{background:var(--today);color:var(--accent-ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;border-radius:4px;padding:2px 5px;border:0;text-align:left;width:100%;min-width:0}
.ev .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;min-width:0}
.ev .a{font-family:var(--f-num);font-size:10.5px;flex:none}
.ev.paid{background:var(--paid-soft);color:var(--paid)} .ev.paid .n{text-decoration:line-through;text-decoration-thickness:1px}
.ev.pend,.ev.tomorrow,.ev.today{background:var(--pend-soft);color:var(--pend)}
.ev.late{background:var(--late-soft);color:var(--late)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
.dots .paid{background:var(--paid)} .dots .pend,.dots .today,.dots .tomorrow{background:var(--pend)} .dots .late{background:var(--late)}
@media (max-width:640px){
  .day{min-height:58px;padding:4px;align-items:center}
  .day .evs{display:none}.dots{display:flex;justify-content:center}
}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cl{display:flex;gap:4px;font-size:11px;border-radius:4px;padding:1px 5px;border:1px solid var(--line2);color:var(--ink);background:transparent;min-width:0;width:100%;text-align:left}
.cl .h{font-family:var(--f-num);font-weight:700;color:var(--paid);flex:none}
.cl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dots i.c{background:transparent;border:1.5px solid var(--ink);width:7px;height:7px;box-sizing:border-box}
.seg{display:inline-flex;border:2px solid var(--line2);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);border-radius:999px;padding:6px 14px;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.clw{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line2)}.clw .clrep{width:auto;align-self:flex-start;font-size:14px;padding:6px 10px}
.clrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:end}
.clrow .x{height:42px;border:2px solid var(--line2);border-radius:8px;background:none;color:var(--muted);font-size:16px}
.sched{font-size:12.5px;color:var(--paid);font-family:var(--f-cond);font-weight:700;letter-spacing:.04em}
.tbtn{border:2px solid var(--line2);background:none;color:var(--ink);border-radius:999px;padding:5px 11px;font-family:var(--f-cond);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin:0 4px}
.tbtn.warn{border-color:color-mix(in srgb,var(--late) 60%,transparent);color:var(--late)}
.subh{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:6px;min-width:0}
.calnav .navb{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);background:none;color:var(--ink);font-size:18px;line-height:1}
.calnav .rango{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{background:var(--sheet);border:1px solid var(--grid);border-radius:10px}
.wk-head{display:grid;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--sheet);border-bottom:1px solid var(--grid);border-radius:10px 10px 0 0}
.wk-d{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;min-width:0}
.wk-d .wl{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.wk-d .wn{font-family:var(--f-display);font-size:22px;color:var(--ink);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.wk-d.hoy .wl{color:var(--accent)} .wk-d.hoy .wn{background:var(--accent);color:#fff}
.wk.dia .wk-head{display:none}
.wk-all{display:grid;border-bottom:1px solid var(--grid)}
.wk-lbl{font-family:var(--f-cond);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 4px;text-align:right;font-weight:700}
.wk-allc{display:flex;flex-direction:column;gap:2px;padding:3px 2px;border-left:1px solid var(--grid);min-width:0}
.wk-body{display:grid;position:relative}
.wk-hours{border-right:1px solid var(--grid)}
.wk-h{position:relative;font-family:var(--f-cond);font-size:12px;color:var(--muted);font-weight:600}
.wk-h span{position:absolute;top:-8px;right:8px;background:var(--sheet);padding:0 2px}
.wk-h:first-child span{top:2px}
.wk-col{position:relative;border-left:1px solid var(--grid);background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px);min-width:0}
.wk-hours+.wk-col{border-left:0}
.wk-col.hoy{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.slot{position:absolute;left:0;right:0;border:0;background:transparent;padding:0}
.slot:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.wk-ev{position:absolute;z-index:2;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 32%,var(--sheet));color:var(--ink);border-radius:6px;padding:3px 6px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;min-width:0}
.wk-ev .en{font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-ev .et{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.03em;color:color-mix(in srgb,var(--c) 45%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-ev.corto{flex-direction:row;gap:6px;align-items:center;padding:1px 6px}
.wk-ev.grp{border-width:2px;border-style:dashed}
.wk-ev:hover{background:color-mix(in srgb,var(--c) 45%,var(--sheet))}
.ahora{position:absolute;left:-1px;right:0;height:2px;background:var(--accent);z-index:3;pointer-events:none}
.ahora::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tira{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tdia{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px}
.tdia .tl{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.1em}
.tdia .tn{font-family:var(--f-display);font-size:20px;color:var(--ink);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.tdia.hoy .tl{color:var(--accent)}
.tdia.on .tn{background:var(--accent);color:#fff}
.tdia .td{display:flex;gap:3px;height:7px}
.tdia .td i{width:6px;height:6px;border-radius:50%}
.tdia .td i.c{border:1.5px solid var(--ink);box-sizing:border-box}
.tdia .td i.paid{background:var(--paid)} .tdia .td i.pend,.tdia .td i.today,.tdia .td i.tomorrow{background:var(--pend)} .tdia .td i.late{background:var(--late)}
@media (max-width:640px){
  .calnav .rango{font-size:16px}
  .calbar{gap:8px}
  .wk.semana .wk-ev{padding:2px 3px}
  .wk.semana .wk-ev .en{font-size:11px}
  .wk.semana .wk-ev .et{display:none}
  .wk.semana .wk-d .wn{font-size:17px;width:30px;height:30px}
  .wk.semana .wk-d .wl{font-size:10px;letter-spacing:.06em}
  .wk.semana .wk-allc .ev .a{display:none}
  .wk.semana .wk-allc .ev{padding:1px 3px;font-size:10px}
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}

/* lista del día */
.daylist{display:flex;flex-direction:column;gap:8px}

/* planilla */
.sheetbox{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.tablewrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.grid th,.grid td{border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:0;text-align:left;vertical-align:middle}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid th{background:var(--head);font-family:var(--f-cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;white-space:nowrap}
.grid td.rn,.grid th.rn{width:38px;text-align:center;color:var(--muted);font-family:var(--f-num);font-size:11px;background:var(--head)}
.grid td{height:38px}
.grid td .txt{padding:0 10px}
.grid input,.grid select{font:inherit;color:inherit;border:0;background:transparent;width:100%;height:38px;padding:0 10px;min-width:0}
.grid input:focus,.grid select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.grid input.money{font-family:var(--f-num);text-align:right}
.grid .first{position:sticky;left:0;background:var(--sheet);z-index:1}
.grid th.first{background:var(--head)}
.grid tr.add td{background:var(--accent-soft)}
.grid tr.add td.rn{color:var(--accent);font-weight:700}
.grid tr.add input::placeholder{color:var(--accent);opacity:.75}
.grid tr.off td{color:var(--muted)}
.grid tfoot td{background:var(--head);font-weight:700;padding:0 10px;height:36px}
.pill{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:4px 11px;font-family:var(--f-cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:0 8px;white-space:nowrap}
.pill.paid{background:var(--paid-soft);color:var(--paid)} .pill.late{background:var(--late-soft);color:var(--late)}
.pill.pend,.pill.today,.pill.tomorrow{background:var(--pend-soft);color:var(--pend)} .pill.na{background:var(--head);color:var(--muted)}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:6px;color:var(--muted);font-size:16px}
.icon-btn:hover{background:var(--head);color:var(--late)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.search{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--grid);border-radius:8px;padding:8px 11px;min-width:0;flex:1;max-width:320px}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* resumen */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-ui);font-size:11px}
.catrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.catrow .bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--grid);overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--late)}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--grid);padding-bottom:6px}
.kv:last-child{border-bottom:0;padding-bottom:0}

/* pestañas de hoja */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--head);border-top:1px solid var(--grid);z-index:10;

<script>
(function(){
const CURSOS=["Canto","Guitarra","Piano","Batería","Bajo","Producción","Mezcla","Ensambles","Mentoría","Otro"];
const GRUPALES=["Ensambles"];
const grupoDe=a=>String((a&&a.grupo)||"").replace(/\|/g,"/").trim();
const nombresGrupo=()=>[...new Set(alumnos.filter(a=>GRUPALES.includes(a.curso)&&grupoDe(a)).map(grupoDe))].sort((x,y)=>x.localeCompare(y));
const tituloGrupo=(curso,g,n)=>`${g||curso} · ${n}`;
const MEDIOS=["Transferencia","Efectivo","Mercado Pago","Otro"];

const LS="alumnos-cuotas-v1";
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const fmtK=n=>n>=1e6?"$"+(n/1e6).toFixed(1).replace(".",",")+"M":n>=1e3?"$"+Math.round(n/1e3)+"k":"$"+Math.round(n);

const mk=(y,m)=>y+"-"+pad(m+1);

const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

let alumnos=[],pagos={},gastos=[],liquidaciones=[],config={};
let cols=null,loaded=false;
let tab="cal",selDay=null,buscar="",verInactivos=false,pendingRender=false;
let cur=(()=>{const t=today();return {y:t.getFullYear(),m:t.getMonth()}})();

/* ---------- guardar ---------- */
function lsSave(){if(cols)return;try{localStorage.setItem(LS,JSON.stringify({alumnos,pagos,gastos,liquidaciones,config}))}catch(e){}}
async function put(col,id,data){
  if(col==="alumnos"){const i=alumnos.findIndex(x=>x.id===id);const v={id,...data};i>=0?alumnos[i]=v:alumnos.push(v)}
  if(col==="pagos")pagos[id]={id,...data};
  if(col==="gastos"){const i=gastos.findIndex(x=>x.id===id);const v={id,...data};i>=0?gastos[i]=v:gastos.push(v)}
  if(col==="liquidaciones"){const i=liquidaciones.findIndex(x=>x.id===id);const v={id,...data};i>=0?liquidaciones[i]=v:liquidaciones.push(v)}
  if(col==="config")config[id]={...data};
  safeRender();
  lsSave();sync.push(col,id,data);agendarAvisos();
}
async function del(col,id){
  if(col==="alumnos")alumnos=alumnos.filter(x=>x.id!==id);
  if(col==="pagos")delete pagos[id];
  if(col==="gastos")gastos=gastos.filter(x=>x.id!==id);
  if(col==="liquidaciones")liquidaciones=liquidaciones.filter(x=>x.id!==id);
  if(col==="config")delete config[id];
  safeRender();
  lsSave();sync.push(col,id,null);agendarAvisos();
}
const strip=o=>{const {id,...r}=o;return r};

/* ---------- roles: la versión instalada reemplaza estas funciones ---------- */
function esDueno(){return true}
function puede(k){return true}
function nombreAdmin(){return "el administrador"}
function aAdmin(){const n=nombreAdmin();return n==="el administrador"?"al administrador":"a "+n}
function parteGeneral(){return Object.assign({tipo:"pct",valor:0},config.parte||{})}
function parteMon(a){
  if(!esDueno())return a.aCobrarMoneda||monDe(a);
  const propia=a.parteAdmin&&(a.parteAdmin.tipo==="pct"||a.parteAdmin.tipo==="monto");
  return !propia&&parteGeneral().tipo==="monto"?"ARS":monDe(a);
}
function parteDe(a){return enPesos(parteOrig(a),parteMon(a))}
function parteOrig(a){
  if(!esDueno())return Number(a.aCobrar)||0;
  const p=a.parteAdmin&&(a.parteAdmin.tipo==="pct"||a.parteAdmin.tipo==="monto")?a.parteAdmin:parteGeneral(),v=Number(p.valor)||0;
  return p.tipo==="monto"?Math.max(0,Math.round(v)):Math.max(0,Math.round((Number(a.cuota)||0)*v/100));
}
const MONEDAS={ARS:{s:"$",n:"Pesos"},USD:{s:"US$",n:"Dólares"},EUR:{s:"€",n:"Euros"}};
const monDe=a=>MONEDAS[a&&a.moneda]?a.moneda:"ARS";
const cotiz=mon=>mon==="ARS"||!MONEDAS[mon]?1:(Number(config.cambio&&config.cambio[mon])||0);
const enPesos=(n,mon)=>(Number(n)||0)*cotiz(mon||"ARS");
const fmtM=(n,mon)=>!mon||mon==="ARS"?fmt(n):MONEDAS[mon].s+" "+new Intl.NumberFormat("es-AR",{maximumFractionDigits:2}).format(Number(n)||0);
const fmtKM=(n,mon)=>!mon||mon==="ARS"?fmtK(n):MONEDAS[mon].s+new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(Number(n)||0);
const usaOtraMoneda=()=>alumnos.some(a=>monDe(a)!=="ARS");
const faltaCotiz=()=>Object.keys(MONEDAS).filter(k=>k!=="ARS"&&alumnos.some(a=>monDe(a)===k&&activoEn(a,cur.y,cur.m))&&!cotiz(k));
const parteTxt=p=>p&&p.tipo==="monto"?fmt(p.valor):`${Number(p&&p.valor)||0}%`;
const tieneCuota=a=>Number(a.cuota)>0||a.cobra===true;
const esDelAdmin=g=>g&&(g.por==="admin"||g.por==="licha");
function liqMes(y,m){const k=mk(y,m);return liquidaciones.filter(l=>l.mes===k)}
function correspondeAdmin(y,m){return alumnos.filter(a=>activoEn(a,y,m)).reduce((s,a)=>s+parteDe(a),0)}

/* ---------- lógica de cuotas ---------- */
const activoEn=(a,y,m)=>{const k=mk(y,m);if(a.inicio&&a.inicio>k)return false;if(a.fin)return k<a.fin;return a.activo!==false};
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],DIAS_L=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const clasesDe=a=>Array.isArray(a.clases)?a.clases.filter(c=>c&&c.d>=1&&c.d<=7).map(c=>{const h=c.h||"18:00";let hf=c.hf;if(!hf){const t=(+h.split(":")[0])*60+(+h.split(":")[1]||0)+(c.dur||60);hf=String(Math.min(23*60+59,t)/60|0).padStart(2,"0")+":"+String(Math.min(23*60+59,t)%60).padStart(2,"0")}const f=/^\d{4}-\d{2}-\d{2}$/.test(String(c.f||""))?String(c.f):"";return {id:c.id||"",d:f?(parse(f).getDay()+6)%7+1:c.d,h,hf,f}}):[];
const enDia=(c,D,wd)=>c.f?c.f===iso(D):c.d===wd;
const fechaCorta=f=>{const D=parse(f);return D.getDate()+"/"+(D.getMonth()+1)};
const horarioTxt=a=>{const c=clasesDe(a).slice().sort((x,y)=>(x.f?1:0)-(y.f?1:0)||String(x.f).localeCompare(String(y.f))||x.d-y.d||String(x.h).localeCompare(String(y.h)));return c.length?c.map(x=>`${DIAS[x.d-1]}${x.f?" "+fechaCorta(x.f):""} ${x.h}–${x.hf}`.trim()).join(" · "):""};//||""}`.trim()).join(" · "):""};
const finTxt=a=>a.fin?new Date(+a.fin.slice(0,4),+a.fin.slice(5,7)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}):"";
let calVer="todo";
const diaVence=(a,y,m)=>Math.min(Math.max(1,a.diaPago||10),lastDay(y,m));
const pagoDe=(a,y,m)=>pagos[a.id+"_"+mk(y,m)];
function estado(a,y,m){
  if(!activoEn(a,y,m))return "na";
  if(pagoDe(a,y,m))return "paid";
  if(!tieneCuota(a))return "na";
  const diff=Math.round((new Date(y,m,diaVence(a,y,m))-today())/864e5);
  return diff<0?"late":diff===0?"today":diff===1?"tomorrow":"pend";
}
const estTxt={paid:"Pagó",late:"Atrasado",today:"Vence hoy",tomorrow:"Vence mañana",pend:"Pendiente",na:"—"};
function resumenMes(y,m){
  const act=alumnos.filter(a=>activoEn(a,y,m));
  let esperado=0,cobrado=0,late=0,pend=0;
  for(const a of act){esperado+=enPesos(a.cuota,monDe(a));const p=pagoDe(a,y,m);if(p)cobrado+=enPesos(p.monto,p.moneda||monDe(a));else{const e=estado(a,y,m);e==="late"?late++:pend++}}
  const gas=gastos.filter(g=>g.fecha&&g.fecha.startsWith(mk(y,m))).reduce((s,g)=>s+(g.monto||0),0)+(esDueno()?liqMes(y,m).reduce((s,l)=>s+(Number(l.monto)||0),0):0);
  return {act:act.length,esperado,cobrado,late,pend,gas,porCobrar:Math.max(0,esperado-act.filter(a=>pagoDe(a,y,m)).reduce((s,a)=>s+enPesos(a.cuota,monDe(a)),0))};
}

/* ---------- vistas ---------- */
function stripHTML(){
  if(!puede("verMontos"))return stripAdminHTML();
  const r=resumenMes(cur.y,cur.m),pc=r.esperado?Math.min(100,r.cobrado/r.esperado*100):0;
  return `<div class="strip">
    <div><span class="lbl">Cobrado</span><span class="num v" style="color:var(--paid)">${fmt(r.cobrado)}</span><div class="progress"><i style="width:${pc.toFixed(0)}%"></i></div></div>
    <div><span class="lbl">Falta cobrar</span><span class="num v">${fmt(r.porCobrar)}</span><span class="muted" style="font-size:12px">de ${fmt(r.esperado)}</span></div>
    <div><span class="lbl">Alumnos activos</span><span class="num v">${r.act}</span><span class="muted" style="font-size:12px">${r.pend} pendientes</span></div>
    <div><span class="lbl">Atrasados</span><span class="num v" style="color:${r.late?"var(--late)":"inherit"}">${r.late}</span><span class="muted" style="font-size:12px">gastos ${fmt(r.gas)}</span></div>
  </div>`;
}
function stripAdminHTML(){
  const {y,m}=cur,corr=correspondeAdmin(y,m),rec=liqMes(y,m).reduce((s,l)=>s+(Number(l.monto)||0),0),act=alumnos.filter(a=>activoEn(a,y,m)).length;
  return `<div class="strip">
    <div><span class="lbl">Te corresponde</span><span class="num v" style="color:var(--paid)">${fmt(corr)}</span><span class="muted" style="font-size:12px">este mes</span></div>
    <div><span class="lbl">Recibido</span><span class="num v">${fmt(rec)}</span><div class="progress"><i style="width:${corr?Math.min(100,rec/corr*100).toFixed(0):0}%"></i></div></div>
    <div><span class="lbl">Falta recibir</span><span class="num v">${fmt(Math.max(0,corr-rec))}</span></div>
    <div><span class="lbl">Alumnos activos</span><span class="num v">${act}</span></div>
  </div>`;
}
function alertsHTML(){

async function cotizacionAuto(tipo,forzar){

function vResumen(){

  const conD=serie.filter(s=>s.ing||s.gas),n=Math.max(1,conD.length);
  const promG=conD.reduce((s,x)=>s+x.gas,0)/n,promI=conD.reduce((s,x)=>s+x.ing,0)/n;

  const cat={};for(const g of gastos){const k=g.fecha&&g.fecha.slice(0,7);if(!k||k<desde||k>hasta)continue;cat[g.categoria]=(cat[g.categoria]||0)+(g.monto||0)}

    g+=`<rect x="${x+w+3}" y="${yv(s.gas)}" width="${w}" height="${H-B-yv(s.gas)}" rx="2" fill="var(--late)"><title>Gastos ${fmt(s.gas)}</title></rect>`;

      <div class="kv"><span>Gastado</span><span class="num" style="color:var(--late)">${fmt(r.gas)}</span></div>
      <div class="kv"><span>Resultado</span><span class="num">${fmt(r.cobrado-r.gas)}</span></div>
      <div class="kv"><span>Si pagan todos</span><span class="num">${fmt(r.esperado-r.gas)}</span></div>
      <div class="kv"><span>Cuota promedio</span><span class="num">${fmt(act.length?r.esperado/act.length:0)}</span></div>
      ${cotizHTML()}
    </div>
    <div class="card"><h2>Promedio mensual</h2>
      <div class="kv"><span>Ingresos</span><span class="num" style="color:var(--paid)">${fmt(promI)}</span></div>
      <div class="kv"><span>Gastos</span><span class="num" style="color:var(--late)">${fmt(promG)}</span></div>
      <div class="kv"><span>Margen</span><span class="num">${fmt(promI-promG)}</span></div>

    </div>
    <div class="card"><div class="toolbar"><h2>Cobrado y gastado</h2><div class="legend"><span><i style="background:var(--paid)"></i>Cobrado</span><span><i style="background:var(--late)"></i>Gastos</span></div></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cobrado y gastado, últimos 6 meses">${g}</svg></div>
    <div class="card"><h2>En qué se gasta <span class="muted" style="font-weight:500;font-size:13px">· promedio por mes</span></h2>

/* ---------- conexión con Google ---------- */
const sync=(()=>{
  let cfg={url:"",token:"",rol:"",nombre:"",last:"",cola:[]},timer=null,enCurso=false,otraVez=false,ultimo=null,error="",cal=null;
  try{cfg={...cfg,...JSON.parse(localStorage.getItem(LS_SYNC)||"{}")}}catch(e){}
  const save=()=>{try{localStorage.setItem(LS_SYNC,JSON.stringify(cfg))}catch(e){}};
  const activo=()=>!!(cfg.url&&cfg.token);
  const ponerYo=()=>{yo=cfg.token?{id:cfg.rol,name:cfg.nombre||ROL_TXT[cfg.rol],rol:ROL_TXT[cfg.rol]||""}:{id:null,name:"",rol:""}};
  ponerYo();
  async function llamar(body,url){
    const ctrl=typeof AbortController!=="undefined"?new AbortController():null;
    const to=setTimeout(()=>ctrl&&ctrl.abort(),45000);
    try{
      const r=await fetch(url||cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token:body.token===undefined?cfg.token:body.token}),redirect:"follow",signal:ctrl?ctrl.signal:undefined});
      const txt=await r.text();
      let j;try{j=JSON.parse(txt)}catch(e){throw new Error(/<html/i.test(txt)?"Google no devolvió datos. Revisá que la implementación sea \"Aplicación web\" con acceso para \"Cualquier usuario\".":"Respuesta inesperada de Google.")}
      if(j.sesion===false&&cfg.token){sesionVencida(j.error);throw new Error(j.error)}
      if(!j.ok)throw new Error(j.error||"Google devolvió un error.");
      return j;
    }catch(e){if(e.name==="AbortError")throw new Error("Google tardó demasiado en responder.");throw e}
    finally{clearTimeout(to)}
  }
  function push(col,id,data){
    if(!activo())return;
    const {id:_,...rest}=data||{};
    cfg.cola=cfg.cola.filter(x=>!(x.col===col&&x.id===id));
    cfg.cola.push({col,id,data:data?rest:{},deleted:!data});
    save();clearTimeout(timer);timer=setTimeout(ciclo,800);
  }
  function aplicar(filas){
    let cambio=false;
    for(const x of filas){
      if(x.updated_at>cfg.last)cfg.last=x.updated_at;
      if(cfg.cola.some(c=>c.col===x.col&&c.id===x.id))continue;
      const v={id:x.id,...(x.data||{})};
      if(x.col==="alumnos"){alumnos=alumnos.filter(a=>a.id!==x.id);if(!x.deleted)alumnos.push(v)}
      else if(x.col==="pagos"){delete pagos[x.id];if(!x.deleted)pagos[x.id]=v}
      else if(x.col==="gastos"){gastos=gastos.filter(g=>g.id!==x.id);if(!x.deleted)gastos.push(v)}
      else if(x.col==="liquidaciones"){liquidaciones=liquidaciones.filter(g=>g.id!==x.id);if(!x.deleted)liquidaciones.push(v)}
      else if(x.col==="config"){delete config[x.id];if(!x.deleted)config[x.id]={...(x.data||{})}}
      cambio=true;
    }
    return cambio;
  }
  async function ciclo(){
    if(!activo())return;
    if(enCurso){otraVez=true;return}
    enCurso=true;
    try{
      const enviados=cfg.cola.slice(0,300);
      const j=await llamar({accion:"sync",since:cfg.last,cambios:enviados});
      cfg.cola=cfg.cola.filter(x=>!enviados.includes(x));
      const cambio=aplicar(j.filas||[]);
      cal=j.calendario||null;
      const antes=JSON.stringify(perfil);
      perfil.permisos=j.permisos||{};perfil.nombres=j.nombres||perfil.nombres;perfil.parte=j.parte||null;perfil.hayAdmin=!!j.hayAdmin;
      if(j.nombres&&j.nombres[cfg.rol]&&j.nombres[cfg.rol]!==cfg.nombre){cfg.nombre=j.nombres[cfg.rol];ponerYo()}
      guardarPerfil();save();ultimo=new Date();error="";
      if(cambio||enviados.length||antes!==JSON.stringify(perfil)){lsSave();agendarAvisos();gcalInvalidar();safeRender()}
    }catch(e){if(activo())error=navigator.onLine===false?"Sin internet. Se guarda cuando vuelva la conexión.":String(e.message||e)}
    enCurso=false;
    const f=$("#foot");if(f)f.textContent=estado();
    if(activo()&&(otraVez||cfg.cola.length)){otraVez=false;clearTimeout(timer);timer=setTimeout(ciclo,1500)}
  }
  function estado(){
    if(!activo())return "";
    if(error)return "Google: "+error;
    if(cfg.cola.length)return "Guardando "+cfg.cola.length+" cambio"+(cfg.cola.length===1?"":"s")+" en Google…";
    if(cal&&cal.ok===false&&esDueno())return "Datos sincronizados. Google Calendar: "+cal.error;
    return ultimo?"Sincronizado con Google · "+ultimo.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):"Conectando con Google…";
  }
  // Entrar: crea la cuenta del dueño, se une con invitación o inicia sesión.
  async function entrar(url,body,subirLocal){
    const j=await llamar({...body,token:""},url);
    cfg={url,token:j.token,rol:j.rol,nombre:j.nombre||"",last:"",cola:[]};
    perfil={permisos:{},nombres:{dueno:"",admin:""},parte:null,hayAdmin:false};
    ponerYo();
    if(subirLocal&&j.rol==="dueno"){
      alumnos.forEach(a=>{const {id,aCobrar,cobra,...r}=a;cfg.cola.push({col:"alumnos",id,data:r,deleted:false})});
      Object.values(pagos).forEach(p=>{const {id,...r}=p;cfg.cola.push({col:"pagos",id,data:r,deleted:false})});
      gastos.forEach(g=>{const {id,...r}=g;cfg.cola.push({col:"gastos",id,data:r,deleted:false})});
    }else vaciarDatos();
    save();guardarPerfil();
    while(cfg.cola.length&&!error){await ciclo()}
    if(!cfg.cola.length)await ciclo();
    return j;
  }
  async function salir(){
    try{if(cfg.token)await llamar({accion:"salir"})}catch(e){}
    const url=cfg.url;cfg={url,token:"",rol:"",nombre:"",last:"",cola:[]};save();
    perfil={permisos:{},nombres:{dueno:"",admin:""},parte:null,hayAdmin:false};guardarPerfil();
    ponerYo();vaciarDatos();cancelarAvisos();gcalInvalidar();
  }
  function sesionVencida(msg){
    const url=cfg.url;cfg={url,token:"",rol:"",nombre:"",last:"",cola:[]};save();ponerYo();vaciarDatos();
    setTimeout(()=>pantallaAcceso(msg||"Tu sesión se cerró. Volvé a entrar."),0);
  }
  return {push,ciclo,estado,activo,llamar,entrar,salir,url:()=>cfg.url,pendientes:()=>cfg.cola.length};
})();

/* ---------- eventos de Google Calendar en la agenda ---------- */
let gcal={cache:{},pend:{}};
function gcalInvalidar(){gcal.cache={}}
function eventosAgenda(desde,hasta){
  if(!sync.activo())return null;
  const k=iso(desde)+"_"+iso(hasta),c=gcal.cache[k];
  if(!c||Date.now()-c.at>90000)pedirEventos(k,desde,hasta);
  return c?c.ev:null;
}
async function pedirEventos(k,desde,hasta){
  if(gcal.pend[k])return;gcal.pend[k]=1;
  try{const j=await sync.llamar({accion:"eventos",desde:iso(desde),hasta:iso(hasta)});gcal.cache[k]={at:Date.now(),ev:j.eventos||[]};safeRender()}
  catch(e){}finally{delete gcal.pend[k]}
}
function verEventoExterno(id){
  let ev=null;for(const c of Object.values(gcal.cache)){ev=(c.ev||[]).find(x=>x.id===id);if(ev)break}
  if(!ev)return;
  const f=parse(ev.s.slice(0,10)).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  panel(`<div class="lbl">Google Calendar</div><h2 style="font-size:24px">${esc(ev.t||"(sin título)")}</h2>
    <p style="margin:0">${esc(f)} · ${esc(ev.s.slice(11,16))}–${esc((ev.e||"").slice(11,16))}</p>
    ${ev.desc?`<p class="muted" style="margin:0;white-space:pre-wrap">${esc(ev.desc)}</p>`:""}
    <p class="muted" style="margin:0;font-size:13.5px">Este evento no es la clase de un alumno: se ve acá porque está en el calendario de las clases. Para cambiarlo, editalo en Google Calendar.</p>
    <div class="actions"><button class="btn" id="geX">Listo</button></div>`);
  $("#geX").onclick=closePanel;
}

/* ---------- avisos (notificaciones del teléfono) ---------- */
const esNativo=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const LN=()=>esNativo()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
const LS_AV="alumnos-cuotas-avisos";
let avisosOn=(()=>{try{return localStorage.getItem(LS_AV)!=="off"}catch(e){return true}})();
let permisoAvisos="?";
function avisosTxt(){
  if(!puede("verCobros"))return "Avisos de cobro: solo para el dueño";
  if(esEscritorio())return "Avisos: llegan al celular";
  if(!esNativo())return "Avisos: solo en la app instalada";
  if(permisoAvisos==="denied")return "Avisos bloqueados · activalos en Ajustes del teléfono";
  return avisosOn&&permisoAvisos==="granted"?"Avisos activados · 9 h":"Activar avisos de cobro";
}
async function activarAvisos(silencioso){
  if(!puede("verCobros")){if(!silencioso)toast("Los avisos de cobro son para quien ve los cobros.");return}
  const L=LN();if(!L){if(!silencioso)toast(esEscritorio()?"Los avisos de cobro llegan al celular. En la compu se ven en el calendario.":"Los avisos funcionan en la app instalada en el teléfono.");return}
  try{
    if(silencioso&&!avisosOn)return;
    const yaActivos=avisosOn&&permisoAvisos==="granted";
    if(!silencioso&&yaActivos){
      avisosOn=false;try{localStorage.setItem(LS_AV,"off")}catch(e){}
      await cancelarAvisos();toast("Avisos desactivados");safeRender();return}
    let p=await L.checkPermissions();
    if(p.display!=="granted")p=await L.requestPermissions();
    permisoAvisos=p.display;
    if(p.display!=="granted"){if(!silencioso)toast("Activá las notificaciones en Ajustes > Alumnos y Cuotas.");safeRender();return}
    avisosOn=true;try{localStorage.setItem(LS_AV,"on")}catch(e){}
    await agendarAvisosYa();if(!silencioso)toast("Listo: te aviso el día antes y el mismo día a las 9");safeRender();
  }catch(e){if(!silencioso)toast("No se pudieron activar los avisos.")}
}
async function cancelarAvisos(){const L=LN();if(!L)return;try{const p=await L.getPending();if(p.notifications&&p.notifications.length)await L.cancel({notifications:p.notifications.map(n=>({id:n.id}))})}catch(e){}}
let avTimer=null;
function agendarAvisos(){clearTimeout(avTimer);avTimer=setTimeout(agendarAvisosYa,1200)}
async function agendarAvisosYa(){
  const L=LN();if(!L)return;
  if(!puede("verCobros")||!avisosOn||permisoAvisos!=="granted"){await cancelarAvisos();return}
  await cancelarAvisos();
  const ahora=new Date(),t=today(),notifs=[],vm=puede("verMontos");let nid=1000;
  const lista=arr=>arr.map(a=>vm?`${a.nombre} (${fmtM(a.cuota,monDe(a))})`:a.nombre).join(", ");
  for(let k=0;k<=30&&notifs.length<60;k++){
    const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+k),y=d.getFullYear(),m=d.getMonth();
    const vence=alumnos.filter(a=>activoEn(a,y,m)&&tieneCuota(a)&&!pagoDe(a,y,m)&&diaVence(a,y,m)===d.getDate());
    if(!vence.length)continue;
    const mons=[...new Set(vence.map(monDe))],total=vence.reduce((s,a)=>s+(Number(a.cuota)||0),0),cuanto=vm&&mons.length===1?fmtM(total,mons[0]):vm?vence.map(a=>fmtM(a.cuota,monDe(a))).join(" + "):`${vence.length} cuota${vence.length===1?"":"s"}`;
    const antes=new Date(y,m,d.getDate()-1,9,0),hoy=new Date(y,m,d.getDate(),9,0);
    if(antes>ahora)notifs.push({id:nid++,title:`Mañana se cobran ${cuanto}`,body:lista(vence),schedule:{at:antes,allowWhileIdle:true}});
    if(hoy>ahora)notifs.push({id:nid++,title:`Hoy se cobran ${cuanto}`,body:lista(vence),schedule:{at:hoy,allowWhileIdle:true}});
  }
  if(notifs.length)try{await L.schedule({notifications:notifs.slice(0,60)})}catch(e){}
}

/* ---------- vincular otro dispositivo (QR o código) ---------- */
const ESQUEMA="fackalumnos://vincular";
function linkVincular(codigo){return `${ESQUEMA}?u=${encodeURIComponent(sync.url())}&c=${encodeURIComponent(codigo)}`}
function leerLinkVincular(txt){
  try{const t=String(txt||"").trim();if(!t.toLowerCase().startsWith(ESQUEMA))return null;
    const q=new URLSearchParams(t.slice(t.indexOf("?")+1));const u=q.get("u"),c=q.get("c");
    if(!u||!c||!/^https:\/\/script\.google(usercontent)?\.com\//.test(u))return null;return {u,c}}catch(e){return null}
}
async function panelVincular(){
  panel(`<h2 style="font-size:24px">Vincular otro dispositivo</h2><p class="muted" style="margin:0">Generando código…</p>`);
  let j;try{j=await sync.llamar({accion:"vincularCrear"})}catch(e){panel(`<h2>No se pudo generar el código</h2><p class="muted" style="margin:0">${esc(e.message)}</p><div class="actions"><button class="btn" id="vX">Cerrar</button></div>`);$("#vX").onclick=closePanel;return}
  let svg="";
  try{const q=qrcode(0,"M");q.addData(linkVincular(j.codigo));q.make();svg=q.createSvgTag({cellSize:6,margin:3,scalable:true})}catch(e){}
  panel(`<div class="lbl">Tu cuenta: ${esc(yo.name)} · ${esc(yo.rol)}</div><h2 style="font-size:24px">Vincular otro dispositivo</h2>
    <div class="qrbox" aria-label="Código QR para vincular">${svg}</div>
    <div style="text-align:center"><div class="by">o escribí este código</div><div class="num" style="font-size:30px;letter-spacing:.18em">${esc(j.codigo)}</div><div class="by" id="vT"></div></div>
    <ol class="pasos">
      <li><b>En el celular:</b> abrí la app y tocá <b>Escanear QR</b> (en la pantalla de ingreso, o en Ajustes si ya hay otra sesión).</li>
      <li><b>En otra computadora:</b> en la pantalla de ingreso pegá la dirección de Google y tocá <b>Tengo un código para vincular</b>.</li>
    </ol>
    <p class="foot" style="margin:0">Abre tu misma cuenta, sin contraseña. Sirve una sola vez y vence en 10 minutos. No lo compartas con otra persona.</p>
    <div class="actions"><button class="btn ghost" id="vOtro">Generar otro</button><button class="btn" id="vX">Listo</button></div>`);
  $("#vX").onclick=closePanel;$("#vOtro").onclick=panelVincular;
  const t=setInterval(()=>{const el=$("#vT");if(!el){clearInterval(t);return}const s=Math.max(0,Math.round((j.vence-Date.now())/1000));el.textContent=s?`Vence en ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`:"Venció: generá otro";if(!s)clearInterval(t)},1000);
}
async function usarVinculo(u,c){
  const root=$("#acceso");
  try{const j=await sync.entrar(u,{accion:"vincularUsar",codigo:c},false);
    if(root){root.hidden=true;root.innerHTML=""}closePanel();tab="cal";render();toast(`Vinculado: ${j.nombre||yo.name}`);if(esNativo())activarAvisos(true);return true}
  catch(e){if(!sync.activo())pantallaAcceso(e.message);else toast(e.message);return false}
}
async function procesarVinculo(txt){
  const v=leerLinkVincular(txt);if(!v){toast("Ese QR no es de Alumnos y Cuotas.");return}
  if(sync.activo()){
    panel(`<h2>¿Cambiar de cuenta?</h2><p class="muted" style="margin:0">En ${dispositivo()} ya está abierta la sesión de ${esc(yo.name)}. Si seguís, se cierra y se abre la cuenta del QR.</p>
      <div class="actions"><button class="btn ghost" id="vcX">Cancelar</button><button class="btn" id="vcOk">Cambiar</button></div>`);
    $("#vcX").onclick=closePanel;
    $("#vcOk").onclick=async()=>{closePanel();await sync.salir();usarVinculo(v.u,v.c)};
    return;
  }
  usarVinculo(v.u,v.c);
}
// Escáner con la cámara (celular o compu)
let escaneo=null;
async function escanearQR(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof jsQR!=="function"){toast("Este dispositivo no deja usar la cámara acá. Usá el código.");return}
  const div=document.createElement("div");div.className="scan";div.innerHTML=`<div class="scanbox"><video playsinline muted></video><div class="scanmarco"></div></div><p>Apuntá la cámara al QR que muestra la otra pantalla.</p><button class="btn ghost" id="scX">Cancelar</button>`;
  document.body.appendChild(div);
  const video=div.querySelector("video"),canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
  let stream=null,vivo=true;
  const cerrar=()=>{vivo=false;if(stream)stream.getTracks().forEach(t=>t.stop());div.remove();escaneo=null};
  escaneo=cerrar;$("#scX").onclick=cerrar;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;await video.play()}
  catch(e){cerrar();toast("No pude abrir la cámara. Dale permiso a la app o usá el código.");return}
  const leer=()=>{if(!vivo)return;
    if(video.readyState>=2&&video.videoWidth){const w=Math.min(640,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);
      const r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});
      if(r&&r.data){if(leerLinkVincular(r.data)){cerrar();procesarVinculo(r.data);return}}}
    requestAnimationFrame(leer)};
  leer();
}
// Abrir la app desde la cámara del teléfono (fackalumnos://vincular?...)
(function enlaces(){
  try{
    const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(!A)return;
    A.addListener("appUrlOpen",e=>{if(e&&e.url)setTimeout(()=>procesarVinculo(e.url),300)});
    A.getLaunchUrl&&A.getLaunchUrl().then(r=>{if(r&&r.url&&leerLinkVincular(r.url))setTimeout(()=>procesarVinculo(r.url),600)}).catch(()=>{});
  }catch(e){}
})();

/* ---------- actualizaciones automáticas ---------- */
const UPD_BASE="https://raw.githubusercontent.com/lugolisandro0-cloud/fack-alumnos-app/main/";
const actualizacion=(()=>{
  let estadoTxt="",nueva=null;
  const off=()=>{try{return localStorage.getItem("fack-update-off")==="1"}catch(e){return false}};
  async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  async function revisar(manual){
    if(!UPD_BASE||UPD_BASE.indexOf("__")===0){estadoTxt="Sin actualizaciones configuradas";return}
    if(off()&&!manual){estadoTxt="Actualizaciones automáticas apagadas";return}
    try{
      const r=await fetch(UPD_BASE+"version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
      const v=await r.json();
      if(cmpVersion(v.version,APP_VERSION)<=0){estadoTxt=`Tenés la última versión (${APP_VERSION})`;return}
      let mala="";try{mala=localStorage.getItem("fack-update-mala")||""}catch(e){}
      if(mala===v.version){estadoTxt=`La versión ${v.version} no arrancó bien en este dispositivo`;return}
      if(v.base&&cmpVersion(APP_BASE,v.base)<0){nueva={...v,instalar:true};estadoTxt=`Hay una versión ${v.version} que hay que instalar de nuevo`;if(manual||!avisada(v.version))avisoInstalar(v);return}
      if(off()){estadoTxt=`Hay una versión nueva (${v.version})`;nueva=v;return}
      const h=await fetch(UPD_BASE+(v.archivo||"index.html")+"?t="+Date.now(),{cache:"no-store"});if(!h.ok)throw 0;
      const html=await h.text();
      if(v.sha256&&await sha(html)!==v.sha256)throw new Error("archivo incompleto");
      if(html.indexOf('var V="'+v.version+'"')<0)throw new Error("versión no coincide");
      localStorage.setItem("fack-update",JSON.stringify({v:v.version,base:v.base||"",html}));
      nueva=v;estadoTxt=`Versión ${v.version} lista`;
      avisoLista(v);
    }catch(e){estadoTxt="No se pudo buscar actualizaciones";if(manual)console.warn(e)}
  }
  function avisada(v){try{return sessionStorage.getItem("fack-avisada")===v}catch(e){return false}}
  function avisoLista(v){
    try{sessionStorage.setItem("fack-avisada",v.version)}catch(e){}
    const d=document.createElement("div");d.className="updbar";
    d.innerHTML=`<span><b>Nueva versión ${esc(v.version)}</b>${v.notas?" · "+esc(v.notas):""}</span><button class="btn sm" id="updYa">Actualizar ahora</button><button class="btn sm ghost" id="updDesp">Después</button>`;
    document.body.appendChild(d);
    d.querySelector("#updYa").onclick=()=>location.reload();
    d.querySelector("#updDesp").onclick=()=>d.remove();
  }
  function avisoInstalar(v){
    try{sessionStorage.setItem("fack-avisada",v.version)}catch(e){}
    const d=document.createElement("div");d.className="updbar";
    d.innerHTML=`<span><b>Versión ${esc(v.version)}</b>: esta necesita instalar la app de nuevo.${v.descarga?"":" Pedile el archivo a quien administra la app."}</span>${v.descarga?`<button class="btn sm" id="updDl">Descargar</button>`:""}<button class="btn sm ghost" id="updDesp">Cerrar</button>`;
    document.body.appendChild(d);
    if(v.descarga)d.querySelector("#updDl").onclick=()=>window.open(v.descarga,"_blank");
    d.querySelector("#updDesp").onclick=()=>d.remove();
  }
  function arranqueOk(){try{localStorage.removeItem("fack-update-arranque");const u=JSON.parse(localStorage.getItem("fack-update")||"null");if(u&&cmpVersion(u.v,APP_BASE)<=0)localStorage.removeItem("fack-update")}catch(e){}}
  function setOff(v){try{v?localStorage.setItem("fack-update-off","1"):localStorage.removeItem("fack-update-off")}catch(e){}}
  return {revisar,arranqueOk,estado:()=>estadoTxt,off,setOff,hayNueva:()=>nueva};
})();
function panelActualizaciones(){
  const pintar=()=>panel(`<h2 style="font-size:24px">Actualizaciones</h2>
    <div class="card" style="background:var(--head)"><div class="kv"><span>Versión en uso</span><span class="num">${esc(APP_VERSION)}</span></div><div class="kv"><span>Instalada</span><span class="num">${esc(APP_BASE)}</span></div></div>
    <label class="check" style="color:var(--ink)"><input type="checkbox" id="uAuto" ${actualizacion.off()?"":"checked"} style="width:18px;height:18px"> Actualizar automáticamente</label>
    <p class="by" style="margin:0">Las versiones nuevas se descargan solas y se aplican la próxima vez que abrís la app. Tus datos no se tocan.</p>
    <p class="by" id="uEst" style="margin:0;color:var(--paid)">${esc(actualizacion.estado())}</p>
    <div class="actions"><button class="btn ghost" id="uX">Cerrar</button><button class="btn" id="uBus">Buscar ahora</button></div>`);
  pintar();
  const bind=()=>{
    $("#uX").onclick=closePanel;
    $("#uAuto").onchange=e=>{actualizacion.setOff(!e.target.checked);toast(e.target.checked?"Actualizaciones automáticas activadas":"Actualizaciones automáticas apagadas")};
    $("#uBus").onclick=async()=>{const b=$("#uBus");b.disabled=true;b.textContent="Buscando…";await actualizacion.revisar(true);pintar();bind()};
  };bind();
}

let tt;function toast(m){clearTimeout(tt);let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;tt=setTimeout(()=>t.remove(),2500)}

/* ---------- eventos ---------- */
document.addEventListener("click",ev=>{
  const T=ev.target;
  const tb=T.closest("nav.tabs [data-tab]");if(tb){tab=tb.dataset.tab;render();scrollTo(0,0);return}
  const go=T.closest("[data-go]");if(go){tab=go.dataset.go;render();return}
  const cu=T.closest("[data-cuota]");if(cu){ev.stopPropagation();abrirCuota(cu.dataset.cuota,cu.dataset.ym);return}
  const gr=T.closest("[data-grupo]");if(gr){const [c,wd,h,hf,g,f]=gr.dataset.grupo.split("|");verGrupo(c,+wd,h,hf,g||"",f||"");return}
  const ge=T.closest("[data-gev]");if(ge){verEventoExterno(ge.dataset.gev);return}
  const lq=T.closest("[data-liq]");if(lq){const l=liquidaciones.find(x=>x.id===lq.dataset.liq);if(l&&esDueno())liquidacionPanel(l);return}
  if(T.id==="admPagar"){liquidacionPanel(null);return}
  if(T.id==="admPerm"){panelPermisos();return}
  const sl=T.closest("[data-slot]");if(sl){if(!(esDueno()||puede("editarAlumnos")))return;const [f,h]=sl.dataset.slot.split("|"),D=parse(f);alumnoPanel(null,{clases:[{d:(D.getDay()+6)%7+1,h,hf:deMin(Math.min(23*60+45,aMin(h)+60)),fs:f}]});return}
  const dy=T.closest("[data-day]");if(dy){const d=+dy.dataset.day;selDay=selDay===d?null:d;render();return}
  const cvw=T.closest("[data-calview]");if(cvw){calView=cvw.dataset.calview;if(calView!=="mes"&&!calAnchor){const t=today();calAnchor=(t.getFullYear()===cur.y&&t.getMonth()===cur.m)?t:new Date(cur.y,cur.m,1)}render();return}
  const cn=T.closest("[data-calnav]");if(cn){moverCal(cn.dataset.calnav);return}
  const gd=T.closest("[data-goday]");if(gd){const D=parse(gd.dataset.goday);calAnchor=D;cur={y:D.getFullYear(),m:D.getMonth()};calView="dia";render();return}
  const eal=T.closest("[data-edit-al]");if(eal){ev.stopPropagation();const a=alumnos.find(x=>x.id===eal.dataset.editAl);if(a)alumnoPanel(a);return}
  const bj=T.closest("[data-baja]");if(bj){const a=alumnos.find(x=>x.id===bj.dataset.baja);if(a){a.activo===false?reactivar(a):bajaPanel(a)}return}
  const da=T.closest("[data-del-al]");if(da){const a=alumnos.find(x=>x.id===da.dataset.delAl);if(a)eliminarPanel(a);return}
  const dg=T.closest("[data-del-g]");if(dg){del("gastos",dg.dataset.delG);toast("Gasto borrado");return}
  if(T.id==="newAdd"){const nm=$("#newNombre").value.trim();if(!nm){toast("Escribí el nombre del alumno.");return}
    alumnoPanel(null,{nombre:nm,curso:$("#newCurso").value,cuota:toNum($("#newCuota").value)||"",diaPago:parseInt($("#newDia").value)||10,telefono:$("#newTel").value.trim()});return}
  if(T.id==="ngAdd"){const c=$("#ngC").value.trim(),mo=toNum($("#ngM").value);if(!c||!mo){toast("Completá concepto y monto.");return}
    put("gastos",uid(),{fecha:$("#ngF").value||iso(today()),concepto:c,categoria:$("#ngK").value,monto:mo,visibleAdmin:!!($("#ngV")&&$("#ngV").checked),por:yo.id,ejemplo:false});toast("Gasto cargado");setTimeout(()=>{const n=$("#ngC");if(n)n.focus()},0);return}
  if(T.id==="cotizBtn"){panelCotiz();return}
  if(T.id==="icsBtn"){activarAvisos();return}
  if(T.id==="clearEx"){alumnos.filter(a=>a.ejemplo).forEach(a=>del("alumnos",a.id));Object.values(pagos).filter(p=>p.ejemplo).forEach(p=>del("pagos",p.id));gastos.filter(g=>g.ejemplo).forEach(g=>del("gastos",g.id));toast("Ejemplos borrados");return}
});

(function iniciar(){
  try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r){alumnos=r.alumnos||[];pagos=r.pagos||{};gastos=r.gastos||[];liquidaciones=r.liquidaciones||[];config=r.config||{}}}catch(e){}

  try{actualizacion.arranqueOk()}catch(e){}
  setTimeout(()=>actualizacion.revisar(false),4000);
  setTimeout(()=>{try{if(usaOtraMoneda())cotizacionAuto()}catch(e){}},6000);
  setInterval(()=>{if(document.visibilityState==="visible")actualizacion.revisar(false)},6*3600*1000);
  // sincronización: al abrir, al volver a la app y cada minuto mientras está abierta (no hace nada sin sesión)
  setInterval(()=>{if(document.visibilityState==="visible")sync.ciclo()},30000);
  addEventListener("focus",()=>sync.ciclo());
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){sync.ciclo();safeRender()}});
  addEventListener("online",()=>sync.ciclo());
  // al cambiar de día con la app abierta
  let dia=iso(today());setInterval(()=>{const d=iso(today());if(d!==dia){dia=d;agendarAvisos();safeRender()}},60000);
  if(!sync.activo()){pantallaAcceso();return}
  const L=LN();
  if(L)L.checkPermissions().then(p=>{permisoAvisos=p.display;if(p.display==="granted"&&avisosOn)agendarAvisosYa();safeRender()}).catch(()=>{});
  sync.ciclo();
})();
